# Security headers snippet (frontend server block ke andar include karo).
# NOTE: frame-ancestors sirf HTTP header se kaam karta hai (meta CSP me ignore hota hai).
# API_ORIGIN ko apne API origin se replace karo (e.g. https://api.example.com).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' API_ORIGIN wss:; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), fullscreen=(self)" always;

  location / { try_files $uri /index.html; }
  # Source maps production me serve nahi hote (build.sourcemap=false).
  location ~ \.map$ { return 404; }
}
